name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install development and camera dependencies
        run: python -m pip install -e ".[dev,camera]"
      - name: Check Python source
        run: python -m ruff check src tests scripts
      - name: Check browser script syntax
        run: node --check src/teleop_v2/web/app.js
      - name: Run focused checks without robot hardware
        run: python -m pytest tests -q
